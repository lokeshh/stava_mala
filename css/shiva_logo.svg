<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Sacred Gold & Saffron Radiance Gradient -->
    <linearGradient id="shivaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    
    <!-- Moon Silver-Cyan Luster -->
    <linearGradient id="chandraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Divine Third Eye Flame Gradient -->
    <linearGradient id="flameEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Cosmic Background Radial Gradient -->
    <radialGradient id="cosmicBg" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#2d1744"/>
      <stop offset="50%" stop-color="#150d28"/>
      <stop offset="85%" stop-color="#0a0614"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>

    <!-- Background Halo Radial -->
    <radialGradient id="haloGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cosmic Disc Background & Sacred Mandala Border -->
  <circle cx="50" cy="50" r="48" fill="url(#cosmicBg)" />
  <circle cx="50" cy="50" r="48" fill="url(#haloGlow)" />
  <circle cx="50" cy="50" r="47.5" stroke="url(#shivaGold)" stroke-width="1.5" stroke-opacity="0.85" fill="none" />
  <circle cx="50" cy="50" r="44" stroke="url(#shivaGold)" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="2 3" fill="none" />

  <!-- Crescent Moon (चन्द्रकला - Somakala of Shiva) -->
  <path d="M 37 27 A 19 19 0 0 1 61 20 A 24 24 0 0 0 39 39 A 21 21 0 0 1 37 27 Z" 
        fill="url(#chandraGlow)" filter="url(#softGlow)" opacity="0.95" />

  <!-- Central Shaft of Trishula (दण्ड) -->
  <path d="M 48.5 35 L 48.5 88 A 1.5 1.5 0 0 0 51.5 88 L 51.5 35 Z" fill="url(#shivaGold)" />
  <circle cx="50" cy="89" r="3" fill="url(#shivaGold)" />

  <!-- Damaru (डमरू - Cosmic Spanda Vibration) -->
  <!-- Upper cone -->
  <path d="M 38 52 L 50 57 L 62 52 C 60 55 40 55 38 52 Z" fill="#b45309" stroke="url(#shivaGold)" stroke-width="0.8"/>
  <path d="M 38 52 L 50 57 L 62 52 L 50 62 Z" fill="url(#shivaGold)" stroke="#78350f" stroke-width="0.6"/>
  <!-- Lower cone -->
  <path d="M 38 67 L 50 62 L 62 67 C 60 64 40 64 38 67 Z" fill="#b45309" stroke="url(#shivaGold)" stroke-width="0.8"/>
  <path d="M 38 67 L 50 62 L 62 67 L 50 57 Z" fill="url(#shivaGold)" stroke="#78350f" stroke-width="0.6"/>
  <!-- Damaru waist band -->
  <rect x="47.5" y="58.5" width="5" height="2" rx="1" fill="#ffffff" />
  <!-- Damaru bead / cords -->
  <path d="M 50 59.5 Q 56 68 60 66" stroke="#fef08a" stroke-width="1.2" fill="none" />
  <circle cx="60" cy="66.5" r="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.6" />
  <path d="M 50 59.5 Q 44 68 40 66" stroke="#fef08a" stroke-width="1.2" fill="none" />
  <circle cx="40" cy="66.5" r="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.6" />

  <!-- Trishula (त्रिशूल - Trika: Iccha, Jnana, Kriya) -->
  <!-- Base Crescent Bracket of Trident -->
  <path d="M 28 32 C 32 44 68 44 72 32 C 66 40 34 40 28 32 Z" fill="url(#shivaGold)" />

  <!-- Center Spear (ज्ञान शक्ति / अनुत्तर) -->
  <path d="M 50 8 C 53.5 15 56 22 55 35 L 45 35 C 44 22 46.5 15 50 8 Z" fill="url(#shivaGold)" />
  <!-- Center blade ridge highlight -->
  <path d="M 50 9 L 50 34" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

  <!-- Left Prong (इच्छा शक्ति) -->
  <path d="M 45 35 C 38 35 24 33 22 20 C 25 25 31 27 37 27 C 40 27 43 29 45 35 Z" fill="url(#shivaGold)" />
  <path d="M 22 20 C 23.5 24 28 27.5 32 28.5 C 29 27.5 25 24 22 20 Z" fill="#fef08a" />
  <circle cx="22" cy="19" r="1.5" fill="#fef08a" />

  <!-- Right Prong (क्रिया शक्ति) -->
  <path d="M 55 35 C 62 35 76 33 78 20 C 75 25 69 27 63 27 C 60 27 57 29 55 35 Z" fill="url(#shivaGold)" />
  <path d="M 78 20 C 76.5 24 72 27.5 68 28.5 C 71 27.5 75 24 78 20 Z" fill="#fef08a" />
  <circle cx="78" cy="19" r="1.5" fill="#fef08a" />

  <!-- Tripuṇḍra (त्रिपुण्ड्र - 3 Sacred Vibhuti Marks) -->
  <path d="M 40.5 38.5 Q 50 40 59.5 38.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.95" />
  <path d="M 41.5 41 Q 50 42.5 58.5 41" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.95" />
  <path d="M 42.5 43.5 Q 50 45 57.5 43.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.95" />

  <!-- Third Eye / Divine Bindu (त्रिनेत्र / उन्मेष बिन्दु) -->
  <ellipse cx="50" cy="41" rx="2.2" ry="3.8" fill="url(#flameEye)" />
  <circle cx="50" cy="41" r="1" fill="#ffffff" />
</svg>
